
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 | Page Not Found | Metaguise</title>

    <meta
        name="robots"
        content="noindex"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            text-align: center;
            background: #fff;
            color: #111;
        }

        .error-page {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
        }

        .error-page h1 {
            margin: 0;
            font-size: 80px;
            line-height: 1;
            font-weight: 700;
        }

        .error-page h2 {
            margin: 20px 0 10px;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 600;
        }

        .error-page p {
            margin: 0 0 30px;
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .error-page a {
            display: inline-block;
            padding: 12px 26px;

            background: #000;
            color: #fff;

            text-decoration: none;
            font-size: 15px;

            transition: opacity 0.2s ease;
        }

        .error-page a:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .error-page {
                padding: 30px 20px;
            }

            .error-page h1 {
                font-size: 60px;
            }

            .error-page h2 {
                font-size: 24px;
            }

            .error-page p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you're looking for doesn't exist.
        </p>

        <a href="/">
            Go Back Home
        </a>

    </main>

</body>
</html>
