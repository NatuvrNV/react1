    after the app content. This keeps them out of the render-blocking path

    GA4 (G-2EMNJ0PYTH) and Google Ads (AW-16992180594) are no longer loaded
    as separate gtag.js scripts here. Add them as tags INSIDE your GTM
    container (tagmanager.google.com) instead — a GA4 Configuration tag and
    a Google Ads Conversion tag, both firing on the "All Pages"/Page View
    trigger. That way the site only ever requests gtm.js once, and GTM
    itself loads GA4 + Ads under the hood. Do the same for the Facebook
    Pixel if you want it centrally managed too (optional — it's already
    lean and deferred below as-is).
  -->

  <!-- ========== Google Tag Manager (single container, deferred) ========== -->
  <script>
    function loadGTM() {
      if (window.__gtmLoaded) return;
      window.__gtmLoaded = true;
      (function(w,d,s,l,i){
        w[l]=w[l]||[];
        w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});

            j=d.createElement(s),
            dl=l!='dataLayer'?'&l='+l:'';
        j.async=true;

        f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-5DNFJRWL');
    }
    ['scroll','mousemove','touchstart','keydown'].forEach(function(evt){
      window.addEventListener(evt, loadGTM, { once: true, passive: true });
    });
    window.addEventListener('load', function(){ setTimeout(loadGTM, 3500); });
  </script>
